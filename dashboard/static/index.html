<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖塔战报 · Spire Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="spire-bg" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">
        <img src="/game/images/ui/title_logo/zhs.png" alt="杀戮尖塔" onerror="this.replaceWith(Object.assign(document.createElement('span'), { textContent: '♜' }))">
      </div>
      <div>
        <div class="brand-title">尖塔战报</div>
        <div class="brand-sub">Spire Chronicle · AI 攀登记录</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="hall" class="active">对局</button>
      <button data-view="replay">回放</button>
      <button data-view="lore">知识库</button>
      <button data-view="live"><span class="live-dot"></span>实时</button>
    </nav>
  </div>
</header>

<main>
  <section id="view-hall" class="view active"></section>
  <section id="view-replay" class="view"></section>
  <section id="view-lore" class="view"></section>
  <section id="view-live" class="view"></section>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
