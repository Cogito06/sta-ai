<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖塔战报 · Spire Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="spire-bg" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <svg class="sigil" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 4 L36 18 L39 18 L41 32 L45 34 L47 50 L52 52 L54 60 L10 60 L12 52 L17 50 L19 34 L23 32 L25 18 L28 18 Z" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-title">尖塔战报</div>
      <div class="brand-sub">SPIRE CHRONICLE · AI 攀登记录</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="hall" class="active">战报大厅</button>
    <button data-view="replay">对局回放</button>
    <button data-view="lore">知识典籍</button>
    <button data-view="live"><span class="live-dot"></span> 实时观战</button>
  </nav>
</header>

<main>
  <section id="view-hall" class="view active"></section>
  <section id="view-replay" class="view"></section>
  <section id="view-lore" class="view"></section>
  <section id="view-live" class="view"></section>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
