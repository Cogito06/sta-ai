<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖塔战报 · Spire Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="embers" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <svg class="sigil" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 L40 22 L60 24 L45 37 L50 58 L32 47 L14 58 L19 37 L4 24 L24 22 Z" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="32" cy="32" r="8" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-title">尖塔战报</div>
      <div class="brand-sub">SPIRE CHRONICLE · AI 攀登记录</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="hall" class="active">⚔ 战报大厅</button>
    <button data-view="replay">📜 对局回放</button>
    <button data-view="lore">📖 知识典籍</button>
    <button data-view="live"><span class="live-dot"></span> 实时观战</button>
  </nav>
</header>

<main>
  <section id="view-hall" class="view active"></section>
  <section id="view-replay" class="view"></section>
  <section id="view-lore" class="view"></section>
  <section id="view-live" class="view"></section>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
