<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖塔战报 · Spire Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17 L5.5 21 L7.5 14 L2 9.5 L9 9 Z" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="brand-title">尖塔战报</div>
        <div class="brand-sub">Spire Chronicle · AI 攀登记录</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="hall" class="active">对局</button>
      <button data-view="replay">回放</button>
      <button data-view="lore">知识库</button>
      <button data-view="live"><span class="live-dot"></span>实时</button>
    </nav>
  </div>
</header>

<main>
  <section id="view-hall" class="view active"></section>
  <section id="view-replay" class="view"></section>
  <section id="view-lore" class="view"></section>
  <section id="view-live" class="view"></section>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
